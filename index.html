}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:600;font-size:16px;line-height:1.6;letter-spacing:.02em;font-synthesis:none;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:400}
button,input,textarea{font:inherit;color:inherit;font-variation-settings:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hazy, worn finish */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--tx-mottle) 0 0/720px 720px}
body::after{content:"";position:fixed;inset:0;z-index:59;pointer-events:none;opacity:var(--tx-op);background:var(--tx-weave) 0 0/260px 260px}

/* lace: valance across the top, curtains down the sides on wide screens */
.valance::before,.curtain{
  -webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2780%27 viewBox=%270 0 80 80%27%3E%3Cdefs%3E%3Cg id=%27f%27 fill=%27none%27 stroke=%27black%27 stroke-width=%271.3%27%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%280%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%2845%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%2890%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28135%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28180%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28225%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28270%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28315%29%27/%3E%3Ccircle r=%273%27/%3E%3Ccircle r=%2719%27/%3E%3Cpath d=%27M0 -19 L19 0 L0 19 L-19 0 Z%27/%3E%3C/g%3E%3C/defs%3E%3Cuse href=%27%23f%27 x=%2740%27 y=%2740%27/%3E%3Cuse href=%27%23f%27 x=%270%27 y=%270%27/%3E%3Cuse href=%27%23f%27 x=%2780%27 y=%270%27/%3E%3Cuse href=%27%23f%27 x=%270%27 y=%2780%27/%3E%3Cuse href=%27%23f%27 x=%2780%27 y=%2780%27/%3E%3Cg fill=%27black%27%3E%3Ccircle cx=%2740%27 cy=%270%27 r=%272%27/%3E%3Ccircle cx=%2740%27 cy=%2780%27 r=%272%27/%3E%3Ccircle cx=%270%27 cy=%2740%27 r=%272%27/%3E%3Ccircle cx=%2780%27 cy=%2740%27 r=%272%27/%3E%3C/g%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2780%27 viewBox=%270 0 80 80%27%3E%3Cdefs%3E%3Cg id=%27f%27 fill=%27none%27 stroke=%27black%27 stroke-width=%271.3%27%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%280%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%2845%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%2890%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28135%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28180%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28225%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28270%29%27/%3E%3Cellipse cx=%270%27 cy=%27-11%27 rx=%274.5%27 ry=%279%27 transform=%27rotate%28315%29%27/%3E%3Ccircle r=%273%27/%3E%3Ccircle r=%2719%27/%3E%3Cpath d=%27M0 -19 L19 0 L0 19 L-19 0 Z%27/%3E%3C/g%3E%3C/defs%3E%3Cuse href=%27%23f%27 x=%2740%27 y=%2740%27/%3E%3Cuse href=%27%23f%27 x=%270%27 y=%270%27/%3E%3Cuse href=%27%23f%27 x=%2780%27 y=%270%27/%3E%3Cuse href=%27%23f%27 x=%270%27 y=%2780%27/%3E%3Cuse href=%27%23f%27 x=%2780%27 y=%2780%27/%3E%3Cg fill=%27black%27%3E%3Ccircle cx=%2740%27 cy=%270%27 r=%272%27/%3E%3Ccircle cx=%2740%27 cy=%2780%27 r=%272%27/%3E%3Ccircle cx=%270%27 cy=%2740%27 r=%272%27/%3E%3Ccircle cx=%2780%27 cy=%2740%27 r=%272%27/%3E%3C/g%3E%3C/svg%3E");
  -webkit-mask-repeat:repeat;mask-repeat:repeat;pointer-events:none}
.valance{position:absolute;top:0;left:0;right:0;height:46px;background:var(--tint);z-index:0;pointer-events:none}
.valance::before{content:"";position:absolute;inset:0;background:var(--lace);-webkit-mask-size:46px 46px;mask-size:46px 46px;opacity:.9}
.valance::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;
  background:
    radial-gradient(circle at 14px 5px,var(--lace-line) 0 1.6px,transparent 2.2px) 0 0/28px 14px repeat-x,
    radial-gradient(circle at 14px 0,var(--tint) 0 12px,var(--lace-line) 12.5px 13.5px,transparent 14px) 0 0/28px 14px repeat-x}
.curtain{display:none;position:fixed;top:0;bottom:0;width:clamp(0px,calc((100vw - 1100px)/2),220px);background:var(--curtain);-webkit-mask-size:64px 64px;mask-size:64px 64px;opacity:.4;z-index:0}
.curtain.l{left:0}.curtain.r{right:0}
@media (min-width:1200px){.curtain{display:block}}

.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:76px 16px 112px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:28px;padding-bottom:14px;flex-wrap:wrap;border-bottom:1px dashed var(--edge)}
.head h1{font-family:var(--head);font-size:clamp(34px,9.5vw,48px);line-height:1.2}
.stamp{display:inline-block;font-family:var(--head);font-size:17px;line-height:1.2;padding:2px 14px 4px;border-radius:999px;margin-left:12px;vertical-align:middle;border:1.5px solid var(--accent);color:var(--accent)}
.datenav{display:flex;gap:6px;align-items:center}
.sync{font-size:14px;color:var(--muted);width:100%;margin-top:2px}

/* layout */
.grid{display:grid;gap:30px}
.tab{display:none;min-width:0}
body[data-tab="home"] #tab-home,
body[data-tab="timer"] #tab-timer,
body[data-tab="month"] #tab-month,
body[data-tab="diary"] #tab-diary,
body[data-tab="ledger"] #tab-ledger,
body[data-tab="todo"] #tab-todo,
body[data-tab="memo"] #tab-memo,
body[data-tab="words"] #tab-words{display:block}
.stack{display:grid;gap:30px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);z-index:70}
.tabbar button{flex:1;background:none;border:0;padding:11px 1px 10px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.tabbar button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
@media (min-width:960px){
  .app{padding-bottom:56px}
  .tabbar{display:none}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home home" "month month" "ledger ledger" "diary diary" "timer todo" "timer memo" "words words"}
  .tab{display:block !important}
  #tab-home{grid-area:home}
  #tab-month{grid-area:month}
  #tab-diary{grid-area:diary}
  #tab-ledger{grid-area:ledger}
  #tab-timer{grid-area:timer}
  #tab-todo{grid-area:todo}
  #tab-memo{grid-area:memo}
  #tab-words{grid-area:words}
}

/* panels: soft paper card, filigree corners, lace hem */
.panel{--trim-fill:var(--panel);--trim-line:var(--edge);
  position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:30px 24px 22px;margin-bottom:10px;
  box-shadow:0 2px 0 rgba(70,45,32,.14)}
.panel::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--stitch);border-radius:8px;pointer-events:none}
.panel::after{content:"";position:absolute;left:12px;right:12px;top:100%;margin-top:-1px;height:11px;pointer-events:none;
  background:
    radial-gradient(circle at 9px 4px,var(--trim-line) 0 1.2px,transparent 1.8px) 0 0/18px 11px repeat-x,
    radial-gradient(circle at 9px 0,var(--trim-fill) 0 8px,var(--trim-line) 8.5px 9.5px,transparent 10px) 0 0/18px 11px repeat-x}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.panel h2{font-family:var(--head);font-size:26px;line-height:1.25}
.meta{font-weight:600;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);font-weight:600;font-size:15px;padding:14px 0}

/* controls */
.btn{border:1.5px solid var(--ink);background:transparent;padding:7px 16px;border-radius:8px;cursor:pointer;min-height:42px;line-height:1.2;font-weight:700;font-size:15px}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.1)}
.btn.sm{min-height:34px;padding:3px 14px;font-size:14px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{color:var(--danger);background:var(--soft)}
.inp{width:100%;min-height:42px;background:var(--field);border:1px solid var(--line);border-bottom:1.5px solid var(--edge);border-radius:8px;padding:7px 13px;font-size:16px;font-weight:600}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted);font-weight:500}
textarea.inp{resize:vertical;min-height:88px}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:2px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* timer: misty coffee plate */
.timer{--trim-fill:#5B463A;--trim-line:#E3BDB0;--stitch:rgba(243,232,216,.45);
  background:#5B463A;
  color:#F3E8D8;border-color:#E3BDB0}
.timer>*{position:relative;z-index:1}
.timer>header{border-bottom-color:rgba(243,232,216,.3)}
.timer .meta{color:#DCC9B6}
.timer .btn{border-color:rgba(243,232,216,.6);color:#F3E8D8}
.timer .btn:hover{background:rgba(243,232,216,.12)}
.timer .btn.primary{background:#E3BDB0;border-color:#E3BDB0;color:#3A2A21}
.timer .btn.primary:hover{background:#E3BDB0;filter:brightness(1.06)}
.timer .inp{background:rgba(255,245,232,.1);border-color:rgba(243,232,216,.35);border-bottom-color:#E3BDB0;color:#F3E8D8}
.timer .inp::placeholder{color:#D3BFAB}
.timer :focus-visible{outline-color:#E3BDB0}
.timer .chip{border-color:rgba(243,232,216,.6);color:#F3E8D8}
.timer .chip[aria-pressed="true"]{background:#F3E8D8;color:#4D3A2F;border-color:#F3E8D8}
.modes{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;min-height:36px}
.presets .inp{width:92px;min-height:34px;padding:3px 8px;text-align:center}
.presets span{font-size:14px;color:#DCC9B6}
.dial{position:relative;width:min(272px,72vw);aspect-ratio:1;margin:10px auto 16px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.dial circle{fill:none;stroke-width:3.6}
.dial .track{stroke:rgba(243,232,216,.2)}
.dial .prog{stroke:#E3BDB0;stroke-linecap:round;stroke-dasharray:339.292;stroke-dashoffset:339.292;transition:stroke-dashoffset .3s linear}
.dial .ticks{stroke:#DCC9B6;stroke-width:1.4;stroke-dasharray:.4 4.6;stroke-linecap:round;opacity:.75}
.dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-weight:600;font-size:clamp(42px,12.5vw,54px);line-height:1;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.clock.long{font-size:clamp(32px,9.5vw,42px)}
.clock .d{display:inline-block;width:.62em;text-align:center}
.clock .c{display:inline-block;width:.3em;text-align:center}
.state{margin-top:6px;font-family:var(--head);font-size:21px;line-height:1.1;color:#E3BDB0}
.ctrls{display:flex;gap:8px;margin-top:10px}
.ctrls .primary{flex:2}
.ctrls .btn{flex:1}
.tmsg{min-height:24px;margin-top:10px;font-weight:700;font-size:15px;color:#E3BDB0}

/* home overview */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--field)}
.stat .n{font-family:var(--head);font-size:26px;line-height:1.2}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.bar2{height:7px;background:var(--soft);border-radius:7px;overflow:hidden;margin-top:8px}
.bar2 i{display:block;height:100%;background:var(--grad);width:0;border-radius:7px}
.goal{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 14px;flex-wrap:wrap}
.goal .inp{width:76px;min-height:34px;padding:3px 8px;text-align:center}
.homecols{display:grid;gap:18px;margin-bottom:4px}
.hcol h3{font-family:var(--head);font-size:19px;line-height:1.3;border-bottom:1px solid var(--line);padding-bottom:2px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 0;margin-top:12px;border-top:1.5px dotted var(--edge)}
.hrow .grow{flex:1;min-width:150px}
.hrow .hc{font-family:var(--head);font-size:26px;margin-right:8px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}.homecols{grid-template-columns:1fr 1fr;gap:28px}}

/* monthly plan */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mhead .ttl{font-family:var(--head);font-size:24px;line-height:1.2}
.mnav{display:flex;gap:6px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:60px;padding:4px 5px;background:var(--field);border:1px solid var(--line);border-radius:6px;cursor:pointer;text-align:left;overflow:hidden;min-width:0}
.day .dn{font-weight:700;font-size:14px;line-height:1.3;min-width:22px;text-align:center}
.day.other{opacity:.5}
.day.today .dn{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 5px}
.day.sel{border:2px solid var(--accent);padding:3px 4px;background:var(--soft)}
.day .dots{display:flex;gap:3px;flex-wrap:wrap}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day .evs{display:none;width:100%;min-width:0}
.ev{display:block;font-size:11px;line-height:1.3;font-weight:600;background:var(--soft);border-left:3px solid var(--accent);padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px}
.day.sel .ev{background:var(--panel)}
.more{font-size:11px;color:var(--muted);font-weight:700}
@media (min-width:720px){.day{min-height:96px}.day .dots{display:none}.day .evs{display:block}}
.daybox{margin-top:18px;padding-top:12px;border-top:1px dashed var(--edge)}
.daybox h3{font-family:var(--head);font-size:21px;line-height:1.3;margin-bottom:4px}
.evform{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.evform .t{width:128px;flex:none}
.evform .tx{flex:1;min-width:150px}
.evt{font-weight:700;min-width:64px;font-size:14px;color:var(--muted)}

/* photo diary */
.dform{display:grid;gap:10px;margin-bottom:18px}
.dpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dpick label.btn{display:inline-flex;align-items:center;cursor:pointer}
.dprev{display:block;width:100%;max-width:240px;aspect-ratio:4/5;object-fit:cover;border:8px solid #FBF5EA;outline:1px solid var(--line);transform:rotate(-1deg)}
.drow{display:flex;gap:8px;align-items:center}
.drow .inp{flex:1;min-width:0}
.dtrack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 16px;margin:0 -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dtrack::-webkit-scrollbar{display:none}
.page{position:relative;flex:0 0 min(86%,380px);scroll-snap-align:center;background:var(--soft);border:1px solid var(--edge);border-radius:8px;padding:16px 16px 14px}
.page::before{content:"";position:absolute;inset:5px;border:1.5px dashed var(--stitch);border-radius:5px;pointer-events:none}
.page .photo{position:relative;background:#FBF5EA;padding:8px;border:1px solid var(--line);margin-bottom:12px;transform:rotate(-.8deg)}
.page:nth-child(even) .photo{transform:rotate(.8deg)}
.page .photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#E7DCCB}
.page .nophoto{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;background:#EFE5D5;color:#66503F;font-size:14px;text-align:center;padding:12px}
.pdate{font-family:var(--head);font-size:20px;line-height:1.3;margin-bottom:4px;padding-right:34px}
.ptext{position:relative;white-space:pre-wrap;word-break:break-word;min-height:3em;padding:2px 4px;border-radius:6px;outline-offset:2px}
.ptext:focus{background:var(--field)}
.page .x{position:absolute;top:10px;right:10px;z-index:2}
.dpager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
.dpager .pos{min-width:64px;text-align:center;font-weight:700}

/* log */
.total{font-family:var(--head);font-size:34px;line-height:1.2}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:108px;margin:14px 0 6px}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;background:none;border:0;padding:0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.wk .bar{display:block;width:100%;max-width:30px;background:#CDB9A3;border-radius:14px 14px 2px 2px}
.wk.sel .bar{background:var(--accent)}
.wk.sel .l{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.wk .v{height:16px;line-height:16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dotted var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:13px;color:var(--muted)}
.logsec{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
.dur{white-space:nowrap;font-weight:700}

/* todo */
.prog-line{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin-bottom:12px}
.prog-line i{display:block;height:100%;background:var(--grad);width:0;border-radius:8px;transition:width .25s}
.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.todo .txt{flex:1;min-width:0;word-break:break-word;cursor:pointer}
.todo.done .txt{color:var(--muted);text-decoration:line-through}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* memo */
.memo{align-items:flex-start}
.memo .body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding:2px 6px;border-radius:6px;outline-offset:2px}
.memo .body:focus{background:var(--field)}
.memo.pin .body{border-left:3px solid var(--accent);padding-left:10px;border-radius:2px 6px 6px 2px}
.pinb{background:none;border:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:14px;padding:6px 8px;border-radius:8px}
.pinb[aria-pressed="true"]{color:var(--accent)}
.pinb:hover{background:var(--soft)}

/* words */
.wtools{display:grid;gap:8px;margin-bottom:14px}
.wform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wform .full{grid-column:1/-1}
.wform .act{grid-column:1/-1;display:flex;gap:8px}
.wform .act .primary{flex:1}
.wsearch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wsearch .inp{flex:1;min-width:140px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 28px}
.word .w{font-weight:800;font-size:20px;word-break:break-word;line-height:1.25}
.word .m{font-size:16px;font-weight:600}
.word .ex{font-size:14px;font-weight:600;color:var(--muted);font-style:italic}
.word.known .w,.word.known .m{opacity:.7}
.review{text-align:center;padding:10px 0 4px}
.review .left{font-size:14px;color:var(--muted)}
.review .big{font-family:var(--head);font-weight:400;font-size:38px;line-height:1.15;margin:22px 0 10px;word-break:break-word}
.review .ans{min-height:88px;font-size:19px;font-weight:600}
.review .ans .ex{display:block;font-size:15px;color:var(--muted);margin-top:6px;font-style:italic}
.review .btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.review .btns .btn{flex:1;max-width:190px}
.reviewing .wtools{display:none}

/* event categories */
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;flex:none}
.chip.cc{display:inline-flex;align-items:center;min-height:30px;padding:2px 12px}
.ev{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 24%,var(--panel))}
.day .dots i{background:var(--c)}
.day.sel .ev{background:color-mix(in srgb,var(--c) 24%,var(--panel))}
.tag{border:1px solid var(--c);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 24%,var(--panel));color:var(--ink);cursor:pointer;white-space:nowrap}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.evcats{margin-top:12px}

/* ledger */
.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.lsum .stat .n{font-size:19px;word-break:break-all}
.lsum .inc{color:var(--pos)}
.lbud{margin-bottom:18px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.lbud .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.lbud .top .inp{width:110px;min-height:34px;padding:3px 8px;text-align:right}
.lbud .bar2.over i{background:var(--danger)}
.lbud .sub{font-size:13px;color:var(--muted);margin-top:6px}
.bar2.over i{background:var(--danger)}
.lgrid{display:grid;gap:22px}
@media (min-width:960px){.lgrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px}}
.lform{display:grid;gap:10px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px dashed var(--edge)}
.seg{display:flex;gap:6px}
.amt{display:flex;align-items:center;gap:8px}
.amt span{font-weight:700;font-size:18px}
.amt .inp{font-size:22px;font-weight:700;text-align:right}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;font-size:12.5px;font-weight:700;min-width:0}
.cat .em{font-size:22px;line-height:1.15}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,var(--panel));box-shadow:inset 0 0 0 1px var(--c)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none}
.donut circle{fill:none;stroke-width:15}
.donut text{fill:var(--ink);text-anchor:middle;font-family:var(--body)}
.leg{flex:1;min-width:160px;display:grid;gap:5px;font-size:14px}
.leg div{display:flex;align-items:center;gap:7px}
.leg .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.leg .a{margin-left:auto;font-weight:700;white-space:nowrap}
.ltitle{font-family:var(--head);font-size:19px;margin:0 0 8px}
.ldh{display:flex;justify-content:space-between;gap:8px;font-family:var(--head);font-size:16px;margin:14px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.lrow .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 26%,var(--panel));font-size:19px;flex:none}
.lrow .amt2{font-weight:700;white-space:nowrap}
.lrow .amt2.inc{color:var(--pos)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 18px;border-radius:8px;font-weight:600;font-size:15px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.toast.on{opacity:1}
@media (min-width:960px){.toast{bottom:24px}}
@media (prefers-reduced-motion: reduce){
  .dial .prog,.prog-line i,.toast{transition:none}
}
</style>

var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

var CIRC = 339.292;

var WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function pad(n){ return String(n).padStart(2,'0'); }
function dkey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ var p = k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDur(sec){
  var m = Math.round(sec/60), h = Math.floor(m/60), r = m%60;
  if(h === 0) return m+' 分鐘';
  return h+' 小時'+(r ? ' '+r+' 分' : '');
}
function fmtShort(sec){
  var m = Math.round(sec/60);
  if(m === 0) return '';
  return m < 60 ? m+'分' : (m/60).toFixed(1)+'時';
}
function hhmm(ts){
  var d = new Date(ts), h = d.getHours();
  return (h%12 || 12)+':'+pad(d.getMinutes())+' '+(h < 12 ? 'AM' : 'PM');
}
function mdhm(ts){ var d = new Date(ts); return MON[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+hhmm(ts); }
function shortDate(k){ var d = parseKey(k); return MON[d.getMonth()].slice(0,3)+' '+d.getDate(); }

function defaults(){
  return { sessions:[], todos:[], memos:[], words:[],
    timer:{ mode:'up', targetMin:25, accMs:0, startedAt:null, subject:'' }, goal:120, events:[], diary:[], ledger:[], budget:0, updatedAt:0 };
}
function normalize(o){
  var d = defaults();
  if(!o || typeof o !== 'object') return d;
  ['sessions','todos','memos','words','events','diary','ledger'].forEach(function(k){ if(Array.isArray(o[k])) d[k] = o[k]; });
  if(o.timer && typeof o.timer === 'object'){ for(var k in d.timer){ if(o.timer[k] !== undefined) d.timer[k] = o.timer[k]; } }
  if(+o.goal > 0) d.goal = +o.goal;
  if(+o.budget > 0) d.budget = +o.budget;
  d.updatedAt = +o.updatedAt || 0;
  return d;
}
var S;
try { S = normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ S = defaults(); }

var cur = dkey();
var wFilter = 'all', wQuery = '';
var rv = null;

/* ---------- storage & sync ---------- */
var remote = null, pushT = null;
var LOCAL_ONLY = '只存在這台裝置', SYNCED = '已同步到你的帳號';
function setSync(t){ $('#sync').textContent = t; }
function persistLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updatedAt = Date.now();
  persistLocal();
  renderHome(); renderMonth(); renderLedger();
  if(remote){
    clearTimeout(pushT);
    pushT = setTimeout(pushRemote, 1200);
  }
}
function pushRemote(){
  if(!remote) return;
  var rest = Object.assign({}, S); delete rest.timer;
  remote.set({ json: JSON.stringify(rest), updatedAt: S.updatedAt })
    .then(function(){ setSync(SYNCED); })
    .catch(function(){ setSync(LOCAL_ONLY); });
}
(async function initRemote(){
  setSync(LOCAL_ONLY);
  try{
    if(!window.claude || !window.claude.use) return;
    var db = await window.claude.use('db');
    var user = await window.claude.use('user');
    if(!db || !user) return;
    var id = await user.id();
    if(!id) return;
    remote = db.collection('data/users/'+id).doc('workbench');
    var snap = await remote.get();
    if(snap.exists){
      var d = snap.data();
      if(d && d.json && (+d.updatedAt || 0) > (S.updatedAt || 0)){
        var incoming = normalize(JSON.parse(d.json));
        incoming.timer = S.timer;
        incoming.updatedAt = +d.updatedAt;
        S = incoming;
        persistLocal();
        renderAll();
        setSync(SYNCED);
      } else if((S.updatedAt || 0) > (+d.updatedAt || 0)){
        pushRemote();
      } else { setSync(SYNCED); }
    } else if(S.updatedAt){
      pushRemote();
    } else { setSync(SYNCED); }
  }catch(e){ remote = null; setSync(LOCAL_ONLY); }
})();

/* ---------- helpers ---------- */
var toastT;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2400);
}

/* ---------- date bar ---------- */
function renderDate(){
  var d = parseKey(cur), today = dkey();
  var diff = Math.round((d - parseKey(today)) / 86400000);
  var tag = diff === 0 ? 'Today' : diff === -1 ? 'Yesterday' : diff === 1 ? 'Tomorrow' : '';
  $('#dateTitle').innerHTML = WDL[d.getDay()]+', '+MON[d.getMonth()].slice(0,3)+' '+d.getDate() + (tag ? '<span class="stamp">'+tag+'</span>' : '');
  $('#today').disabled = cur === today;
}

/* ---------- timer ---------- */
function T(){ return S.timer; }
function elapsed(){ return T().accMs + (T().startedAt ? Date.now() - T().startedAt : 0); }
function targetMs(){ return T().targetMin * 60000; }
var lastClock = '';
function drawTime(){
  var t = T(), el = elapsed(), sec, frac;
  if(t.mode === 'down'){
    var rem = Math.max(0, targetMs() - el);
    sec = Math.ceil(rem/1000); frac = rem / targetMs();
  } else {
    sec = Math.floor(el/1000); frac = (el % 3600000) / 3600000;
  }
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  var str = h > 0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
  if(str !== lastClock){
    lastClock = str;
    var c = $('#clock');
    c.innerHTML = str.split('').map(function(ch){ return ch === ':' ? '<span class="c">:</span>' : '<span class="d">'+ch+'</span>'; }).join('');
    c.classList.toggle('long', h > 0);
    c.setAttribute('aria-label', str);
  }
  $('#ring').style.strokeDashoffset = (CIRC * (1 - Math.min(1, Math.max(0, frac)))).toFixed(2);
  var running = !!t.startedAt;
  var stTxt = running ? '專注中' : (el > 0 ? '已暫停' : '準備好了');
  $('#state').textContent = stTxt;
  $('#homeClock').textContent = str;
  $('#homeState').textContent = stTxt + (t.mode === 'down' ? ' · 倒數' : '') + (t.subject ? ' · '+t.subject : '');
  document.title = (running ? str+' · ' : '') + 'Daily Workbench';
}
function renderTimerControls(){
  var t = T(), el = elapsed(), running = !!t.startedAt;
  $$('[data-mode]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === t.mode)); });
  $('#presets').hidden = t.mode !== 'down';
  $$('#presets [data-min]').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.min === t.targetMin)); });
  var cm = $('#customMin');
  if(document.activeElement !== cm){ cm.value = [25,50,90].indexOf(t.targetMin) >= 0 ? '' : t.targetMin; }
  $('#btnGo').textContent = running ? '暫停' : (el > 0 ? '繼續' : '開始');
  $('#homeGo').textContent = running ? '暫停' : (el > 0 ? '繼續' : '開始');
  $('#btnStop').disabled = el < 1000;
  $('#btnReset').disabled = el < 1000;
  $('#timerMeta').textContent = t.mode === 'down' ? '倒數 '+t.targetMin+' 分鐘' : '自由計時';
  if(document.activeElement !== $('#subject')) $('#subject').value = t.subject || '';
  drawTime();
}
function tmsg(t){ $('#tmsg').textContent = t; }
function finish(auto){
  var t = T();
  var sec = auto ? t.targetMin*60 : Math.round(elapsed()/1000);
  t.startedAt = null; t.accMs = 0;
  if(sec >= 60){
    S.sessions.push({ id:uid(), date:dkey(), subject:(t.subject||'').trim(), sec:sec, at:Date.now() });
    tmsg((auto ? '時間到。' : '')+'已記錄 '+fmtDur(sec)+'。');
  } else {
    tmsg('不到一分鐘，這段沒有記錄。');
  }
  save();
  if(auto) beep();
  renderTimerControls(); renderLog();
}
function beep(){
  try{
    var A = window.AudioContext || window.webkitAudioContext;
    var c = new A();
    [0,0.28,0.56].forEach(function(d){
      var o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime+d); o.stop(c.currentTime+d+0.16);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}
setInterval(function(){
  var t = T();
  if(t.mode === 'down' && t.startedAt && elapsed() >= targetMs()){ finish(true); return; }
  drawTime();
}, 250);

$$('[data-mode]').forEach(function(b){
  b.addEventListener('click', function(){
    if(elapsed() > 0){ toast('請先結束或歸零，再切換模式'); return; }
    T().mode = b.dataset.mode; save(); renderTimerControls();
  });
});
$$('#presets [data-min]').forEach(function(b){
  b.addEventListener('click', function(){
    if(elapsed() > 0){ toast('請先結束或歸零，再改時間'); return; }
    T().targetMin = +b.dataset.min; save(); renderTimerControls();
  });
});
$('#customMin').addEventListener('change', function(e){
  var v = Math.round(+e.target.value);
  if(elapsed() > 0){ toast('請先結束或歸零，再改時間'); renderTimerControls(); return; }
  if(v >= 1 && v <= 600){ T().targetMin = v; save(); }
  renderTimerControls();
});
$('#subject').addEventListener('input', function(e){ T().subject = e.target.value; save(); });
$('#btnGo').addEventListener('click', function(){
  var t = T(); tmsg('');
  if(t.startedAt){ t.accMs = elapsed(); t.startedAt = null; }
  else { t.startedAt = Date.now(); }
  save(); renderTimerControls();
});
$('#btnStop').addEventListener('click', function(){ finish(false); });
$('#btnReset').addEventListener('click', function(){
  var t = T(); t.accMs = 0; t.startedAt = null; tmsg('已歸零，這段沒有記錄。'); save(); renderTimerControls();
});

/* ---------- study log ---------- */
function renderLog(){
  var today = dkey();
  var day = S.sessions.filter(function(s){ return s.date === cur; }).sort(function(a,b){ return b.at - a.at; });
  var sum = day.reduce(function(a,s){ return a + s.sec; }, 0);
  $('#logDate').textContent = cur === today ? 'Today' : shortDate(cur);
  $('#logTotal').textContent = sum ? fmtDur(sum) : '0 分鐘';

  var days = [], totals = [];
  for(var i = 6; i >= 0; i--){
    var k = addDays(today, -i); days.push(k);
    totals.push(S.sessions.filter(function(s){ return s.date === k; }).reduce(function(a,s){ return a + s.sec; }, 0));
  }
  var max = Math.max.apply(null, totals.concat([3600]));
  $('#week').innerHTML = days.map(function(k, i){
    var h = totals[i] ? Math.max(3, Math.round(totals[i]/max*58)) : 2;
    return '<button class="wk'+(k === cur ? ' sel' : '')+'" data-date="'+k+'" aria-label="'+shortDate(k)+', '+(totals[i] ? fmtDur(totals[i]) : '沒有紀錄')+'">'
      +'<span class="v">'+fmtShort(totals[i])+'</span><span class="bar" style="height:'+h+'px"></span><span class="l">'+WD[parseKey(k).getDay()]+'</span></button>';
  }).join('');

  $('#sessions').innerHTML = day.length ? day.map(function(s){
    return '<div class="row"><div class="grow"><div>'+esc(s.subject || '未命名')+'</div><div class="sub">'+hhmm(s.at)+' 結束</div></div>'
      +'<div class="dur">'+fmtDur(s.sec)+'</div><button class="x" data-act="sess-del" data-id="'+s.id+'" aria-label="刪除這筆紀錄">×</button></div>';
  }).join('') : '<div class="empty">這天還沒有學習紀錄。按下「開始」，結束後會自動記在這裡。</div>';

  var names = [], seen = {};
  S.sessions.slice().sort(function(a,b){ return b.at - a.at; }).forEach(function(s){
    if(s.subject && !seen[s.subject] && names.length < 20){ seen[s.subject] = 1; names.push(s.subject); }
  });
  $('#subjects').innerHTML = names.map(function(n){ return '<option value="'+esc(n)+'"></option>'; }).join('');
}

/* ---------- to-do ---------- */
function renderTodos(){
  var list = S.todos.filter(function(t){ return t.date === cur; });
  var open = list.filter(function(t){ return !t.done; }), done = list.filter(function(t){ return t.done; });
  var ordered = open.concat(done);
  $('#todoMeta').textContent = list.length ? done.length+' / '+list.length+' 完成' : '';
  $('#todoBar').style.width = (list.length ? done.length/list.length*100 : 0)+'%';
  $('#todoList').innerHTML = ordered.length ? ordered.map(function(t){
    return '<div class="row todo'+(t.done ? ' done' : '')+'"><input type="checkbox" id="td-'+t.id+'" data-act="todo-toggle" data-id="'+t.id+'"'+(t.done ? ' checked' : '')+'>'
      +'<label class="txt" for="td-'+t.id+'">'+esc(t.text)+'</label>'
      +'<button class="x" data-act="todo-del" data-id="'+t.id+'" aria-label="刪除待辦">×</button></div>';
  }).join('') : '<div class="empty">這天還沒有待辦。在上面寫下第一件要做的事。</div>';
  var carry = S.todos.filter(function(t){ return t.date < cur && !t.done; }).length;
  var tools = '';
  if(carry) tools += '<button class="btn sm" data-act="todo-carry">把先前未完成的 '+carry+' 項帶到這天</button>';
  if(done.length) tools += '<button class="btn sm" data-act="todo-clear">清除已完成</button>';
  $('#todoTools').innerHTML = tools;
}

/* ---------- memos ---------- */
function renderMemos(){
  var list = S.memos.slice().sort(function(a,b){ return (b.pin?1:0) - (a.pin?1:0) || b.at - a.at; });
  $('#memoMeta').textContent = list.length ? list.length+' 則' : '';
  $('#memoList').innerHTML = list.length ? list.map(function(m){
    return '<div class="row memo'+(m.pin ? ' pin' : '')+'"><div class="grow"><div class="body" contenteditable="true" spellcheck="false" data-act="memo-edit" data-id="'+m.id+'" aria-label="備忘內容，可直接編輯">'+esc(m.text)+'</div>'
      +'<div class="sub">'+mdhm(m.at)+'</div></div>'
      +'<button class="pinb" data-act="memo-pin" data-id="'+m.id+'" aria-pressed="'+(!!m.pin)+'">'+(m.pin ? '已釘選' : '釘選')+'</button>'
      +'<button class="x" data-act="memo-del" data-id="'+m.id+'" aria-label="刪除備忘">×</button></div>';
  }).join('') : '<div class="empty">還沒有備忘。想到的點子、要問老師的問題，都可以先寫在這裡。</div>';
}

/* ---------- words ---------- */
function shuffle(a){ for(var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderWords(){
  var total = S.words.length, known = S.words.filter(function(w){ return w.known; }).length;
  var learning = total - known;
  $('#wordMeta').textContent = total ? '共 '+total+' 個，熟了 '+known+' 個' : '';
  $('#reviewBtn').textContent = learning ? '複習不熟的（'+learning+'）' : '開始複習';
  $('#wordPanel').classList.toggle('reviewing', !!rv);
  var body = $('#wordsBody');
  if(rv){ renderReview(body); return; }
  var q = wQuery.trim().toLowerCase();
  var list = S.words.filter(function(w){
    if(wFilter === 'learning' && w.known) return false;
    if(wFilter === 'known' && !w.known) return false;
    if(q && (w.w+' '+(w.m||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a,b){ return b.at - a.at; });
  if(!list.length){
    body.innerHTML = '<div class="empty">'+(total ? '沒有符合的單字。' : '單字本是空的。在上面輸入第一個單字和它的意思。')+'</div>';
    return;
  }
  body.innerHTML = '<div class="wlist">'+list.map(function(w){
    return '<div class="row word'+(w.known ? ' known' : '')+'"><div class="grow"><div class="w">'+esc(w.w)+'</div>'
      +'<div class="m">'+(w.m ? esc(w.m) : '<span class="sub">還沒寫意思</span>')+'</div>'
      +(w.ex ? '<div class="ex">'+esc(w.ex)+'</div>' : '')+'</div>'
      +'<button class="chip" data-act="word-known" data-id="'+w.id+'" aria-pressed="'+(!!w.known)+'">'+(w.known ? '熟了' : '不熟')+'</button>'
      +'<button class="x" data-act="word-del" data-id="'+w.id+'" aria-label="刪除單字">×</button></div>';
  }).join('')+'</div>';
}
function renderReview(body){
  while(rv.queue.length && !S.words.some(function(w){ return w.id === rv.queue[0]; })) rv.queue.shift();
  if(!rv.queue.length){
    body.innerHTML = '<div class="review"><div class="big" style="font-size:28px">這一輪複習完了</div><div class="ans">記住了 '+rv.got+' 個單字。</div>'
      +'<div class="btns"><button class="btn primary" data-act="rv-end">回到單字本</button></div></div>';
    return;
  }
  var w = S.words.find(function(x){ return x.id === rv.queue[0]; });
  body.innerHTML = '<div class="review"><div class="left">還剩 '+rv.queue.length+' 個</div>'
    +'<div class="big">'+esc(w.w)+'</div>'
    +'<div class="ans">'+(rv.shown ? esc(w.m || '（還沒寫意思）')+(w.ex ? '<span class="ex">'+esc(w.ex)+'</span>' : '') : '')+'</div>'
    +'<div class="btns">'
    +(rv.shown
      ? '<button class="btn" data-act="rv-again">還不熟</button><button class="btn primary" data-act="rv-got">記得了</button>'
      : '<button class="btn primary" data-act="rv-show">看意思</button>')
    +'</div><div class="btns"><button class="btn sm" data-act="rv-end">結束複習</button></div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if(act === 'todo-toggle' || act === 'memo-edit') return;
  switch(act){
    case 'sess-del': S.sessions = S.sessions.filter(function(s){ return s.id !== id; }); save(); renderLog(); break;
    case 'todo-del': S.todos = S.todos.filter(function(t){ return t.id !== id; }); save(); renderTodos(); break;
    case 'todo-carry':
      S.todos.forEach(function(t){ if(t.date < cur && !t.done) t.date = cur; });
      save(); renderTodos(); break;
    case 'todo-clear':
      S.todos = S.todos.filter(function(t){ return !(t.date === cur && t.done); }); save(); renderTodos(); break;
    case 'memo-del': S.memos = S.memos.filter(function(m){ return m.id !== id; }); save(); renderMemos(); break;
    case 'memo-pin':
      S.memos.forEach(function(m){ if(m.id === id) m.pin = !m.pin; }); save(); renderMemos(); break;
    case 'word-del': S.words = S.words.filter(function(w){ return w.id !== id; }); save(); renderWords(); break;
    case 'word-known':
      S.words.forEach(function(w){ if(w.id === id) w.known = !w.known; }); save(); renderWords(); break;
    case 'rv-show': rv.shown = true; renderWords(); break;
    case 'rv-got':
      var gid = rv.queue.shift(); rv.got++; rv.shown = false;
      S.words.forEach(function(w){ if(w.id === gid) w.known = true; });
      save(); renderWords(); break;
    case 'rv-again': rv.queue.push(rv.queue.shift()); rv.shown = false; renderWords(); break;
    case 'rv-end': rv = null; renderWords(); break;
    case 'home-toggle': $('#btnGo').click(); break;
    case 'day':
      monthSel = b.dataset.date; var dd = parseKey(monthSel); mc = { y:dd.getFullYear(), m:dd.getMonth() }; renderMonth(); break;
    case 'diary-del': deleteDiary(id); break;
    case 'ev-cat':
      S.events.forEach(function(x){ if(x.id === id){ var i = 0; for(var j = 0; j < EV_CATS.length; j++) if(EV_CATS[j].k === evCatOf(x).k) i = j; x.cat = EV_CATS[(i+1)%EV_CATS.length].k; } });
      save(); break;
    case 'l-del': S.ledger = S.ledger.filter(function(x){ return x.id !== id; }); save(); renderLedger(); break;
    case 'ev-del': S.events = S.events.filter(function(x){ return x.id !== id; }); save(); break;
  }
});
document.addEventListener('change', function(e){
  var b = e.target.closest('[data-act="todo-toggle"]'); if(!b) return;
  S.todos.forEach(function(t){ if(t.id === b.dataset.id) t.done = b.checked; });
  save(); renderTodos();
});
document.addEventListener('focusout', function(e){
  var b = e.target.closest && e.target.closest('[data-act="memo-edit"]'); if(!b) return;
  var txt = b.innerText.replace(/\s+$/,'').replace(/^\s+/,'');
  var m = S.memos.find(function(x){ return x.id === b.dataset.id; });
  if(!m) return;
  if(!txt){ b.textContent = m.text; toast('備忘不能是空的，要刪除請按 ×'); return; }
  if(txt !== m.text){ m.text = txt; save(); }
});
document.addEventListener('click', function(e){
  var wk = e.target.closest('.wk'); if(!wk) return;
  cur = wk.dataset.date; renderDate(); renderLog(); renderTodos(); renderHome();
});

$('#todoForm').addEventListener('submit', function(e){
  e.preventDefault();
  var inp = $('#todoInput'), v = inp.value.trim(); if(!v) return;
  S.todos.push({ id:uid(), date:cur, text:v, done:false });
  inp.value = ''; save(); renderTodos(); inp.focus();
});
function addMemo(){
  var inp = $('#memoInput'), v = inp.value.trim(); if(!v) return;
  S.memos.push({ id:uid(), text:v, at:Date.now(), pin:false });
  inp.value = ''; save(); renderMemos();
}
$('#memoForm').addEventListener('submit', function(e){ e.preventDefault(); addMemo(); });
$('#memoInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addMemo(); }
});
$('#wordForm').addEventListener('submit', function(e){
  e.preventDefault();
  var w = $('#wInput').value.trim(), m = $('#mInput').value.trim(), ex = $('#eInput').value.trim();
  if(!w) return;
  if(S.words.some(function(x){ return x.w.toLowerCase() === w.toLowerCase(); })){ toast('這個單字已經在單字本裡了'); return; }
  S.words.push({ id:uid(), w:w, m:m, ex:ex, at:Date.now(), known:false });
  $('#wInput').value = ''; $('#mInput').value = ''; $('#eInput').value = '';
  save(); renderWords(); $('#wInput').focus();
});
$('#wSearch').addEventListener('input', function(e){ wQuery = e.target.value; renderWords(); });
$$('#wFilter [data-f]').forEach(function(b){
  b.addEventListener('click', function(){
    wFilter = b.dataset.f;
    $$('#wFilter [data-f]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
    renderWords();
  });
});

function fmtTime(v){

  var p = v.split(':'), h = +p[0];
  return (h%12 || 12)+':'+p[1]+' '+(h < 12 ? 'AM' : 'PM');

var EV_CATS = [
  { k:'exam',    n:'考試', c:'#A84F4A' },
  { k:'holiday', n:'節日', c:'#B8923A' },
  { k:'fun',     n:'娛樂', c:'#7C8C5E' },
  { k:'report',  n:'報告', c:'#6B7F94' },
  { k:'other',   n:'其他', c:'#8C6F5A' }
];
var evCatSel = 'exam', evFilter = 'all';
function evCatOf(e){ for(var i = 0; i < EV_CATS.length; i++) if(EV_CATS[i].k === e.cat) return EV_CATS[i]; return EV_CATS[4]; }
function renderEvCats(){
  $('#evCats').innerHTML = EV_CATS.map(function(c){
    return '<button type="button" class="chip cc" data-evcat="'+c.k+'" style="--c:'+c.c+'" aria-pressed="'+(c.k === evCatSel)+'"><span class="cdot"></span>'+c.n+'</button>';
  }).join('');
  $('#evFilter').innerHTML = '<button type="button" class="chip" data-evf="all" aria-pressed="'+(evFilter === 'all')+'">全部</button>'+EV_CATS.map(function(c){
    return '<button type="button" class="chip cc" data-evf="'+c.k+'" style="--c:'+c.c+'" aria-pressed="'+(c.k === evFilter)+'"><span class="cdot"></span>'+c.n+'</button>';
  }).join('');
}
function eventsFor(k){
  return S.events.filter(function(e){ return e.date === k; }).sort(function(a,b){
    var x = a.time || '', y = b.time || '';
    return x < y ? -1 : x > y ? 1 : (a.at||0) - (b.at||0);
  });
}
function renderMonth(){
  renderEvCats();
  var today = dkey(), y = mc.y, m = mc.m;
  $('#monthTitle').textContent = MON[m]+' '+y;
  $('#dow').innerHTML = WD.map(function(d){ return '<div>'+d+'</div>'; }).join('');
  var first = new Date(y, m, 1), start = first.getDay();
  var byDate = {};
  S.events.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });
  var html = '', count = 0;
  for(var i = 0; i < 42; i++){
    var d = new Date(y, m, 1 - start + i), k = dkey(d), inMonth = d.getMonth() === m;
    var all = eventsFor(k), evs = all.filter(function(e){ return evFilter === 'all' || evCatOf(e).k === evFilter; });
    if(inMonth) count += all.length;
    var cls = 'day'+(inMonth ? '' : ' other')+(k === today ? ' today' : '')+(k === monthSel ? ' sel' : '');
    var dots = evs.slice(0,3).map(function(e){ return '<i style="--c:'+evCatOf(e).c+'"></i>'; }).join('');
    var chips = evs.slice(0,2).map(function(e){ return '<span class="ev" style="--c:'+evCatOf(e).c+'">'+esc(e.text)+'</span>'; }).join('') + (evs.length > 2 ? '<span class="more">+'+(evs.length-2)+'</span>' : '');
    html += '<button class="'+cls+'" data-act="day" data-date="'+k+'" aria-label="'+MON[d.getMonth()]+' '+d.getDate()+', '+(evs.length ? evs.length+' 件事' : '沒有事項')+'">'
      +'<span class="dn">'+d.getDate()+'</span><span class="dots">'+dots+'</span><span class="evs">'+chips+'</span></button>';
  }
  $('#cal').innerHTML = html;
  $('#monthMeta').textContent = count ? '本月共 '+count+' 件事' : '';
  var sd = parseKey(monthSel), list = eventsFor(monthSel);
  $('#dayTitle').textContent = WDL[sd.getDay()]+', '+MON[sd.getMonth()]+' '+sd.getDate()+(monthSel === today ? ' (today)' : '');
  $('#dayList').innerHTML = list.length ? list.map(function(e){
    return '<div class="row todo'+(e.done ? ' done' : '')+'"><input type="checkbox" id="ev-'+e.id+'" data-act="ev-toggle" data-id="'+e.id+'"'+(e.done ? ' checked' : '')+'>'
      +'<span class="evt">'+fmtTime(e.time)+'</span><label class="txt" for="ev-'+e.id+'">'+esc(e.text)+'</label>'
      +'<button type="button" class="tag" data-act="ev-cat" data-id="'+e.id+'" style="--c:'+evCatOf(e).c+'" aria-label="分類：'+evCatOf(e).n+'，按一下換分類">'+evCatOf(e).n+'</button>'
      +'<button class="x" data-act="ev-del" data-id="'+e.id+'" aria-label="刪除事項">×</button></div>';
  }).join('') : '<div class="empty">這天還沒有安排。在下面加入第一件事。</div>';
}

/* ---------- photo diary ---------- */
var pending = null, pendingUrl = '';
function shrink(file, max, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*s)); c.height = Math.max(1, Math.round(img.height*s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', q);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function blobToDataURL(b){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(b); });
}
async function getAssets(){
  try{ if(window.claude && window.claude.use) return await window.claude.use('assets'); }catch(e){}
  return null;
}
function clearPending(){
  pending = null;
  if(pendingUrl){ URL.revokeObjectURL(pendingUrl); pendingUrl = ''; }
  $('#dPrev').hidden = true; $('#dClear').hidden = true;
  $('#dFileName').textContent = '還沒選照片'; $('#dFile').value = '';
}
function diaryDate(k){
  var d = parseKey(k);
  return WDL[d.getDay()]+', '+MON[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear();
}
function photoSrc(e){
  if(!e.photo) return '';
  if(e.photo.k === 'a') return '/_blob/'+e.photo.id;
  try{ return localStorage.getItem('wb-photo-'+e.id) || ''; }catch(x){ return ''; }
}
function renderDiary(){
  var list = S.diary.slice().sort(function(a,b){ return b.date < a.date ? -1 : b.date > a.date ? 1 : b.at - a.at; });
  $('#diaryMeta').textContent = list.length ? list.length+' 篇' : '';
  $('#dTrack').innerHTML = list.length ? list.map(function(e){
    var src = photoSrc(e);
    var ph = e.photo ? (src ? '<div class="photo"><img src="'+src+'" alt="日記照片" loading="lazy"></div>' : '<div class="photo"><div class="nophoto">這張照片存在另一台裝置，這裡看不到</div></div>') : '';
    return '<article class="page" data-id="'+e.id+'">'+ph
      +'<div class="pdate">'+diaryDate(e.date)+'</div>'
      +'<div class="ptext" contenteditable="true" spellcheck="false" data-act="diary-edit" data-id="'+e.id+'" aria-label="日記內容，可直接編輯">'+esc(e.text)+'</div>'
      +'<button class="x" data-act="diary-del" data-id="'+e.id+'" aria-label="刪除這篇日記">×</button></article>';
  }).join('') : '<div class="empty">還沒有日記。選一張照片，寫下今天的小日記。</div>';
  $('#dTrack').scrollLeft = 0;
  updatePager();
}
function updatePager(){
  var tr = $('#dTrack'), n = tr.querySelectorAll('.page').length;
  $('#dPager').hidden = n < 2;
  if(n < 2) return;
  var slides = tr.querySelectorAll('.page'), mid = tr.scrollLeft + tr.clientWidth/2, idx = 0, best = 1e9;
  for(var i = 0; i < slides.length; i++){
    var c = slides[i].offsetLeft - tr.offsetLeft + slides[i].offsetWidth/2, dd = Math.abs(c - mid);
    if(dd < best){ best = dd; idx = i; }
  }
  $('#dPos').textContent = (idx+1)+' / '+n;
}
var pagerT;
$('#dTrack').addEventListener('scroll', function(){ clearTimeout(pagerT); pagerT = setTimeout(updatePager, 60); });
function slide(dir){
  var tr = $('#dTrack'), s = tr.querySelector('.page'); if(!s) return;
  tr.scrollBy({ left: dir*(s.offsetWidth+14), behavior:'smooth' });
}
$('#dPrevBtn').addEventListener('click', function(){ slide(-1); });
$('#dNextBtn').addEventListener('click', function(){ slide(1); });
$('#dDate').value = dkey();
$('#dFile').addEventListener('change', async function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  try{
    var b = await shrink(f, 1280, 0.82);
    if(pendingUrl) URL.revokeObjectURL(pendingUrl);
    pending = b; pendingUrl = URL.createObjectURL(b);
    $('#dPrev').src = pendingUrl; $('#dPrev').hidden = false; $('#dClear').hidden = false;
    $('#dFileName').textContent = '已選好照片';
  }catch(err){ clearPending(); toast('這張照片讀不出來，換一張試試'); }
});
$('#dClear').addEventListener('click', clearPending);
$('#diaryForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var text = $('#dText').value.trim();
  if(!text && !pending){ toast('至少選一張照片，或寫幾句話'); return; }
  var btn = $('#dSave'); btn.disabled = true; btn.textContent = '儲存中…';
  var entry = { id:uid(), date:$('#dDate').value || dkey(), at:Date.now(), text:text };
  try{
    if(pending){
      var photo = null, assets = await getAssets();
      if(assets){
        try{ var r = await assets.upload(pending); photo = { k:'a', id:r.id }; }catch(err){ photo = null; }
      }
      if(!photo){
        try{ localStorage.setItem('wb-photo-'+entry.id, await blobToDataURL(pending)); photo = { k:'l' }; }
        catch(err){ toast('照片太大，這台裝置存不下'); return; }
      }
      entry.photo = photo;
    }
    S.diary.push(entry); save(); clearPending();
    $('#dText').value = ''; $('#dDate').value = dkey();
    renderDiary();
    toast('日記存好了');
  } finally { btn.disabled = false; btn.textContent = '存成日記'; }
});
async function deleteDiary(id){
  var e = S.diary.find(function(x){ return x.id === id; }); if(!e) return;
  S.diary = S.diary.filter(function(x){ return x.id !== id; });
  save(); renderDiary();
  if(e.photo && e.photo.k === 'a'){
    try{ var a = await getAssets(); if(a) await a.delete(e.photo.id); }catch(err){}
  } else { try{ localStorage.removeItem('wb-photo-'+id); }catch(err){} }
}
document.addEventListener('focusout', function(e){
  var b = e.target.closest && e.target.closest('[data-act="diary-edit"]'); if(!b) return;
  var txt = b.innerText.replace(/\s+$/,'').replace(/^\s+/,'');
  var d = S.diary.find(function(x){ return x.id === b.dataset.id; });
  if(!d) return;
  if(!txt && !d.photo){ b.textContent = d.text; toast('日記不能是空的，要刪除請按 ×'); return; }
  if(txt !== d.text){ d.text = txt; save(); }
});

/* ---------- ledger ---------- */
var EXP = [
  { k:'food', n:'餐飲', e:'🍜', c:'#B5674A' }, { k:'transport', n:'交通', e:'🚌', c:'#6B7F94' },
  { k:'shop', n:'購物', e:'🛍️', c:'#A8697F' }, { k:'fun', n:'娛樂', e:'🎮', c:'#7C8C5E' },
  { k:'study', n:'學習', e:'📚', c:'#8C7A4E' }, { k:'home', n:'居住', e:'🏠', c:'#9A8068' },
  { k:'health', n:'醫療', e:'💊', c:'#B8923A' }, { k:'other', n:'其他', e:'🎁', c:'#8C6F5A' }
];
var INC = [
  { k:'allow', n:'零用錢', e:'💰', c:'#7C8C5E' }, { k:'parttime', n:'打工', e:'💼', c:'#6B7F94' },
  { k:'scholar', n:'獎學金', e:'🎓', c:'#B8923A' }, { k:'gift', n:'紅包', e:'🧧', c:'#A84F4A' },
  { k:'oinc', n:'其他', e:'✨', c:'#8C6F5A' }
];
var lc = { y:new Date().getFullYear(), m:new Date().getMonth() }, lType = 'exp', lCat = 'food', lq = '';
function catList(type){ return type === 'inc' ? INC : EXP; }
function catInfo(type, k){ var l = catList(type); for(var i = 0; i < l.length; i++) if(l[i].k === k) return l[i]; return l[l.length-1]; }
function money(n){ return 'NT$ '+Number(n).toLocaleString('en-US', { maximumFractionDigits:2 }); }
function sumOf(list){ return list.reduce(function(a,x){ return a + x.amt; }, 0); }
function renderCats(){
  $('#lCats').innerHTML = catList(lType).map(function(c){
    return '<button type="button" class="cat" data-lcat="'+c.k+'" style="--c:'+c.c+'" aria-pressed="'+(c.k === lCat)+'"><span class="em">'+c.e+'</span>'+c.n+'</button>';
  }).join('');
  $$('[data-ltype]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.ltype === lType)); });
}
function renderLedger(){
  var prefix = lc.y+'-'+pad(lc.m+1);
  var rows = S.ledger.filter(function(x){ return x.date.indexOf(prefix) === 0; });
  var exp = rows.filter(function(x){ return x.type === 'exp'; }), inc = rows.filter(function(x){ return x.type === 'inc'; });
  var te = sumOf(exp), ti = sumOf(inc);
  $('#ledgerTitle').textContent = MON[lc.m]+' '+lc.y;
  $('#ledgerMeta').textContent = rows.length ? '本月 '+rows.length+' 筆' : '';
  $('#lSum').innerHTML =
    '<div class="stat"><div class="n">'+money(te)+'</div><div class="l">支出</div></div>'
   +'<div class="stat"><div class="n inc">'+money(ti)+'</div><div class="l">收入</div></div>'
   +'<div class="stat"><div class="n">'+(ti-te < 0 ? '−' : '')+money(Math.abs(ti-te))+'</div><div class="l">結餘</div></div>';

  var b = $('#budgetIn'); if(document.activeElement !== b) b.value = S.budget || '';
  var wrap = $('#budgetBarWrap'), bt = $('#budgetText');
  if(S.budget > 0){
    var pctUsed = Math.min(100, Math.round(te/S.budget*100));
    $('#budgetBar').style.width = pctUsed+'%';
    wrap.classList.toggle('over', te > S.budget);
    wrap.hidden = false;
    var now = new Date(), isNow = now.getFullYear() === lc.y && now.getMonth() === lc.m;
    var txt = te > S.budget ? '已超出預算 '+money(te - S.budget) : '還剩 '+money(S.budget - te)+'（已用 '+pctUsed+'%）';
    if(isNow && te <= S.budget){
      var dim = new Date(lc.y, lc.m+1, 0).getDate(), left = dim - now.getDate() + 1;
      txt += '，剩 '+left+' 天，每天可花 '+money(Math.floor((S.budget - te)/left));
    }
    bt.textContent = txt;
  } else { wrap.hidden = true; bt.textContent = '設定每月預算，就能看到還剩多少可以花。'; }

  // donut by category
  var byCat = {};
  exp.forEach(function(x){ byCat[x.cat] = (byCat[x.cat] || 0) + x.amt; });
  var ks = Object.keys(byCat).sort(function(a,b){ return byCat[b] - byCat[a]; });
  if(!ks.length){ $('#lChart').innerHTML = '<div class="empty">這個月還沒有支出。記下第一筆，這裡就會出現分類比例。</div>'; }
  else {
    var C = 2*Math.PI*44, acc = 0;
    var segs = ks.map(function(k){
      var info = catInfo('exp', k), len = byCat[k]/te*C;
      var s = '<circle cx="60" cy="60" r="44" stroke="'+info.c+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"></circle>';
      acc += len; return s;
    }).join('');
    var legend = ks.map(function(k){
      var info = catInfo('exp', k);
      return '<div style="--c:'+info.c+'"><span class="sw"></span>'+info.e+' '+info.n+'<span class="a">'+money(byCat[k])+' · '+Math.round(byCat[k]/te*100)+'%</span></div>';
    }).join('');
    $('#lChart').innerHTML = '<div class="donutwrap"><svg class="donut" viewBox="0 0 120 120" role="img" aria-label="支出分類比例"><g transform="rotate(-90 60 60)">'+segs+'</g>'
      +'<text x="60" y="56" font-size="9">支出</text><text x="60" y="71" font-size="11" font-weight="700">'+Math.round(te).toLocaleString('en-US')+'</text></svg><div class="leg">'+legend+'</div></div>';
  }

  // grouped list
  var q = lq.trim().toLowerCase();
  var shown = rows.filter(function(x){
    if(!q) return true;
    var info = catInfo(x.type, x.cat);
    return (info.n+' '+(x.note||'')+' '+(x.method||'')).toLowerCase().indexOf(q) >= 0;
  }).sort(function(a,b){ return b.date < a.date ? -1 : b.date > a.date ? 1 : b.at - a.at; });
  if(!shown.length){ $('#lList').innerHTML = '<div class="empty">'+(rows.length ? '沒有符合的帳目。' : '這個月還沒有帳目。在左邊（或上面）輸入金額，選分類，按「記一筆」。')+'</div>'; return; }
  var html = '', lastDate = '';
  shown.forEach(function(x, i){
    if(x.date !== lastDate){
      lastDate = x.date;
      var day = shown.filter(function(y){ return y.date === x.date; });
      var de = sumOf(day.filter(function(y){ return y.type === 'exp'; })), di = sumOf(day.filter(function(y){ return y.type === 'inc'; }));
      var d = parseKey(x.date);
      html += '<div class="ldh"><span>'+WD[d.getDay()]+', '+MON[d.getMonth()].slice(0,3)+' '+d.getDate()+'</span><span>'+(de ? '−'+money(de) : '')+(de && di ? '　' : '')+(di ? '+'+money(di) : '')+'</span></div>';
    }
    var info = catInfo(x.type, x.cat);
    html += '<div class="row lrow" style="--c:'+info.c+'"><span class="ic">'+info.e+'</span>'
      +'<div class="grow"><div>'+info.n+(x.note ? ' · '+esc(x.note) : '')+'</div><div class="sub">'+esc(x.method || '')+'</div></div>'
      +'<span class="amt2'+(x.type === 'inc' ? ' inc' : '')+'">'+(x.type === 'inc' ? '+' : '−')+money(x.amt)+'</span>'
      +'<button class="x" data-act="l-del" data-id="'+x.id+'" aria-label="刪除這筆帳目">×</button></div>';
  });
  $('#lList').innerHTML = html;
}

/* ---------- backup / restore ---------- */
function backupText(){ var rest = Object.assign({}, S); delete rest.timer; return JSON.stringify(rest); }
function showBk(open){ var b = $('#bkBox'); b.hidden = !open; b.style.display = open ? 'block' : 'none'; $('#bkRestore').textContent = '覆蓋還原'; }
$('#bkCopy').addEventListener('click', function(){
  var txt = backupText();
  var done = function(){ toast('已複製備份。到新的地方按「貼上還原」'); };
  var fail = function(){ showBk(true); $('#bkText').value = txt; $('#bkText').select(); toast('請全選這段文字，手動複製'); };
  try{ navigator.clipboard.writeText(txt).then(done, fail); }catch(e){ fail(); }
});
$('#bkOpen').addEventListener('click', function(){ showBk(true); $('#bkText').value = ''; $('#bkText').focus(); });
$('#bkClose').addEventListener('click', function(){ showBk(false); });
$('#bkMerge').addEventListener('click', function(){
  var raw = $('#bkText').value.trim();
  if(!raw){ toast('先貼上備份內容'); return; }
  var inc;
  try{ inc = normalize(JSON.parse(raw)); }catch(e){ toast('這不是有效的備份'); return; }
  var added = 0;
  ['sessions','todos','memos','words','events','diary','ledger'].forEach(function(k){
    var have = {};
    S[k].forEach(function(x){ if(x && x.id) have[x.id] = 1; });
    inc[k].forEach(function(x){ if(x && x.id && !have[x.id]){ S[k].push(x); have[x.id] = 1; added++; } });
  });
  if(inc.budget > 0 && !(S.budget > 0)) S.budget = inc.budget;
  if(added){ save(); renderAll(); }
  showBk(false);
  toast(added ? '已合併 '+added+' 筆新紀錄' : '沒有新的紀錄需要合併');
});
$('#bkRestore').addEventListener('click', function(){
  var b = $('#bkRestore');
  var raw = $('#bkText').value.trim();
  if(!raw){ toast('先貼上備份內容'); return; }
  var inc;
  try{ inc = normalize(JSON.parse(raw)); }catch(e){ toast('這不是有效的備份'); return; }
  if(b.textContent !== '確定覆蓋？'){ b.textContent = '確定覆蓋？'; toast('還原會取代目前這台裝置上的資料，再按一次確認'); return; }
  inc.timer = S.timer; S = inc; save(); renderAll(); showBk(false); toast('已還原');
});

/* ---------- home overview ---------- */
function setTab(n){
  document.body.dataset.tab = n;
  $$('.tabbar [data-tab]').forEach(function(x){ x.setAttribute('aria-selected', String(x.dataset.tab === n)); });
  window.scrollTo(0, 0);
}
function renderHome(){
  var today = dkey();
  var sum = S.sessions.filter(function(s){ return s.date === cur; }).reduce(function(a,s){ return a + s.sec; }, 0);
  var goalSec = (S.goal || 120) * 60;
  var tl = S.todos.filter(function(x){ return x.date === cur; });
  var tdone = tl.filter(function(x){ return x.done; }).length;
  var open = tl.filter(function(x){ return !x.done; });
  var known = S.words.filter(function(w){ return w.known; }).length, wt = S.words.length;
  var pct = function(a,b){ return b ? Math.min(100, Math.round(a/b*100)) : 0; };
  var spent = sumOf(S.ledger.filter(function(x){ return x.type === 'exp' && x.date.indexOf(cur.slice(0,7)) === 0; }));
  $('#homeMeta').textContent = cur === today ? 'Today' : shortDate(cur);
  var g = $('#goalMin'); if(document.activeElement !== g) g.value = S.goal || 120;
  $('#homeStats').innerHTML =
    '<div class="stat"><div class="n">'+(sum ? fmtDur(sum) : '0 分鐘')+'</div><div class="l">已學習，目標 '+fmtDur(goalSec)+'</div><div class="bar2"><i style="width:'+pct(sum,goalSec)+'%"></i></div></div>'
   +'<div class="stat"><div class="n">'+tdone+' / '+tl.length+'</div><div class="l">待辦完成</div><div class="bar2"><i style="width:'+pct(tdone,tl.length)+'%"></i></div></div>'
   +'<div class="stat"><div class="n">'+known+' / '+wt+'</div><div class="l">單字已熟</div><div class="bar2"><i style="width:'+pct(known,wt)+'%"></i></div></div>'
   +'<div class="stat"><div class="n">'+money(spent)+'</div><div class="l">'+(S.budget > 0 ? '本月支出，預算 '+money(S.budget) : '本月支出')+'</div>'+(S.budget > 0 ? '<div class="bar2'+(spent > S.budget ? ' over' : '')+'"><i style="width:'+pct(spent,S.budget)+'%"></i></div>' : '')+'</div>';

  var shown = open.slice(0,5);
  $('#homeTodos').innerHTML = shown.length ? shown.map(function(x){
    return '<div class="row todo"><input type="checkbox" id="hd-'+x.id+'" data-act="todo-toggle" data-id="'+x.id+'"><label class="txt" for="hd-'+x.id+'">'+esc(x.text)+'</label></div>';
  }).join('') + (open.length > 5 ? '<button class="link" data-go="todo">還有 '+(open.length-5)+' 項</button>' : '')
  : (tl.length ? '<div class="empty">清單上的事都完成了。</div>' : '<div class="empty">這天還沒有待辦。</div><button class="link" data-go="todo">新增待辦</button>');

  var ms = S.memos.slice().sort(function(a,b){ return (b.pin?1:0) - (a.pin?1:0) || b.at - a.at; }).slice(0,2);
  $('#homeMemos').innerHTML = ms.length ? ms.map(function(m){
    return '<div class="row"><div class="grow"><div class="clamp">'+esc(m.text)+'</div><div class="sub">'+mdhm(m.at)+(m.pin ? ' · 已釘選' : '')+'</div></div></div>';
  }).join('') + '<button class="link" data-go="memo">全部備忘</button>'
  : '<div class="empty">還沒有備忘。</div><button class="link" data-go="memo">寫一則</button>';

  var hev = eventsFor(cur);
  $('#homeEvents').innerHTML = hev.length
    ? '<span class="grow"><span class="sub">行事曆</span>'+hev.slice(0,4).map(function(e){ return '<div><span class="cdot" style="--c:'+evCatOf(e).c+'"></span>'+(e.time ? '<strong>'+fmtTime(e.time)+'</strong> · ' : '')+esc(e.text)+'</div>'; }).join('')+(hev.length > 4 ? '<div class="sub">還有 '+(hev.length-4)+' 項</div>' : '')+'</span><button class="btn sm" data-go="month">開啟月曆</button>'
    : '<span class="grow">這天行事曆上沒有安排。</span><button class="btn sm" data-go="month">規劃這個月</button>';

  var learning = S.words.filter(function(w){ return !w.known; }).sort(function(a,b){ return b.at - a.at; });
  $('#homeWord').innerHTML = learning.length
    ? '<span class="grow"><span class="sub">還在學</span><br><strong>'+esc(learning[0].w)+'</strong>'+(learning[0].m ? ' – '+esc(learning[0].m) : '')+'</span><button class="btn sm" data-go="words-review">複習 '+learning.length+' 個</button>'
    : '<span class="grow">'+(wt ? '所有單字都已標成熟了。' : '還沒有單字。到「單字」分頁加入第一個。')+'</span><button class="btn sm" data-go="words">開啟單字本</button>';
}
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]'); if(!g) return;
  var d = g.dataset.go;
  if(d === 'words-review'){ setTab('words'); $('#reviewBtn').click(); } else setTab(d);
});
$('#goalMin').addEventListener('change', function(e){
  var v = Math.round(+e.target.value);
  if(v >= 10 && v <= 1440){ S.goal = v; save(); } else { e.target.value = S.goal || 120; }
});

function renderAll(){
  renderDate(); renderTimerControls(); renderLog(); renderTodos(); renderMemos(); renderWords(); renderHome(); renderMonth(); renderDiary(); renderLedger();
}
renderAll();
})();
</script>
</body>
</html>
